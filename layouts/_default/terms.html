{{ define "main" }}
<section class="page-head">
  <div class="wrap narrow">
    <p class="crumb mono"><a href="/posts/">Blog</a></p>
    <h1>Tags</h1>
  </div>
</section>
<section class="section tight">
  <div class="wrap narrow">
    <ul class="tag-list mono">
      {{ range .Data.Terms.Alphabetical }}
      <li><a href="{{ .Page.RelPermalink }}">{{ .Page.Title }}</a> <span class="muted">{{ .Count }}</span></li>
      {{ end }}
    </ul>
  </div>
</section>
{{ end }}
