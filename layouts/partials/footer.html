{{- $p := hugo.Data.profile -}}
<footer class="site-footer">
  <div class="wrap foot">
    <p class="mono muted">&copy; {{ now.Year }} {{ $p.name }}</p>
    <ul class="foot-links mono">
      <li><a href="{{ $p.github }}" rel="me noopener">GitHub</a></li>
      <li><a href="{{ $p.linkedin }}" rel="me noopener">LinkedIn</a></li>
      <li><a href="mailto:{{ $p.email }}">Email</a></li>
      <li><a href="{{ $p.resume }}">Résumé</a></li>
      {{ with site.Home.OutputFormats.Get "atom" }}<li><a href="{{ .RelPermalink }}">Feed</a></li>{{ end }}
    </ul>
  </div>
</footer>
{{ $js := resources.Get "js/theme.js" | minify | fingerprint }}
<script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" defer></script>
